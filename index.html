<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舍弗勒足球俱乐部 | 官网</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    :root {
      --green-primary: #00B050;
      --green-bright:  #34D399;
      --green-dark:    #006F34;
      --green-glow:    rgba(0, 176, 80, 0.55);
      --bg-deep:       #070908;
      --text-white:    #f3f4f6;
      --text-gray:     #b8c2cc;
      --card-bg:       rgba(12, 16, 14, 0.72);
      --card-border:   rgba(0, 176, 80, 0.22);
    }

    body {
      color: var(--text-white);
      background-color: var(--bg-deep);
      position: relative;
      overflow-x: hidden;
    }

    /* 全局固定球场背景（不变） */
    .bg-stadium-wrap {
      position: fixed;
      inset: 0;
      z-index: -1;
    }
    .bg-stadium-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .bg-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.68);
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    header {
      padding: 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap:16px;
    }
    .logo-box {
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo-box img {
      height: 64px;
    }
    .logo-box h1 {
      font-size: 22px;
      color: var(--green-primary);
    }

    nav a {
      color: var(--text-white);
      text-decoration: none;
      margin:0 10px;
      transition: 0.2s;
    }
    nav a:hover {
      color: var(--green-bright);
    }

    section {
      margin: 48px 0;
    }
    .section-title {
      font-size: 24px;
      margin-bottom: 20px;
      color: var(--green-bright);
      border-left: 4px solid var(--green-primary);
      padding-left:12px;
    }

    /* 下一场比赛 */
    .match-card {
      background: var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:14px;
      padding:24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
    }
    .match-info h3 {
      font-size:20px;
      margin-bottom:8px;
    }
    .match-tip {
      color: var(--text-gray);
    }

    /* 球队荣誉 */
    .honor-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
      gap:16px;
    }
    .honor-item {
      background: var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:12px;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .honor-text h4 {
      margin-bottom:4px;
    }
    .honor-text p {
      color:var(--text-gray);
      font-size:14px;
    }
    .trophy-icon {
      color:var(--green-primary);
      font-size:28px;
      filter: drop-shadow(0 0 8px var(--green-glow));
    }

    /* 合照区块 */
    .team-photo-wrap {
      border-radius:14px;
      overflow:hidden;
      border:1px solid var(--card-border);
    }
    .team-photo-wrap img {
      width:100%;
      display:block;
    }

    /* 球员分组标题 */
    .pos-group-title {
      font-size:18px;
      margin:32px 0 12px;
      color:var(--green-primary);
    }

    /* 球员卡片 左图右文 方案A */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px,1fr));
      gap:18px;
    }
    .player-card {
      background: var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:14px;
      display:flex;
      overflow:hidden;
    }
    .player-photo {
      width: 140px;
      flex-shrink:0;
      background-position:center;
      background-size:cover;
      position:relative;
    }
    .player-info {
      flex:1;
      padding:16px;
    }
    .player-num {
      font-size:26px;
      font-weight:bold;
      color:var(--green-bright);
    }
    .player-name {
      font-size:18px;
      margin:4px 0 8px;
    }
    .player-tag {
      display:inline-block;
      font-size:12px;
      padding:2px 8px;
      border-radius:99px;
      margin-right:6px;
    }
    .tag-captain {
      background:rgba(0,176,80,0.22);
      color:var(--green-bright);
    }
    .tag-manager {
      background:rgba(160,160,160,0.22);
      color:#cccccc;
    }
    .player-stat {
      margin-top:10px;
      font-size:14px;
      color:var(--text-gray);
      line-height:1.6;
    }
    .hot-box {
      margin-top:8px;
      font-size:14px;
    }
    .hot-btn {
      cursor:pointer;
      color:var(--green-bright);
      user-select:none;
    }

    /* 移动端自动上下布局 */
    @media(max-width:640px){
      .player-card {
        flex-direction:column;
      }
      .player-photo {
        width:100%;
        height:180px;
      }
    }

    footer {
      text-align:center;
      padding:32px 0;
      color:var(--text-gray);
      font-size:14px;
    }
  </style>
</head>
<body>
  <!-- 全局球场背景 -->
  <div class="bg-stadium-wrap">
    <img src="bg-stadium.jpg" alt="球场背景" onerror="console.log('球场背景加载失败')">
  </div>
  <div class="bg-mask"></div>

  <div class="container">
    <header>
      <div class="logo-box">
        <!-- ✅ 修正：队标路径 -->
        <img src="logo.png" alt="舍弗勒足球俱乐部Logo" onerror="console.log('队标logo加载失败')">
        <h1>舍弗勒足球俱乐部</h1>
      </div>
      <nav>
        <a href="#match">下一场</a>
        <a href="#honor">球队荣誉</a>
        <a href="#team">球队合照</a>
        <a href="#players">球员名单</a>
      </nav>
    </header>

    <section id="match">
      <h2 class="section-title">即将开赛</h2>
      <div class="match-card" id="matchWrap">
        <div class="match-info">
          <h3 id="matchTitle">加载中...</h3>
          <p class="match-tip" id="matchTip"></p>
        </div>
        <div id="matchCount"></div>
      </div>
    </section>

    <section id="honor">
      <h2 class="section-title">球队荣誉</h2>
      <div class="honor-list">
        <div class="honor-item">
          <div class="honor-text">
            <h4>2026 第八届太仓“中德友谊杯”</h4>
            <p>冠军</p>
          </div>
          <div class="trophy-icon">🏆</div>
        </div>
        <div class="honor-item">
          <div class="honor-text">
            <h4>2026 德甲长三角企业杯</h4>
            <p>亚军</p>
          </div>
          <div class="trophy-icon">🥈</div>
        </div>
        <div class="honor-item">
          <div class="honor-text">
            <h4>2026 “双元制杯”校企五人制</h4>
            <p>冠军</p>
          </div>
          <div class="trophy-icon">🏆</div>
        </div>
        <div class="honor-item">
          <div class="honor-text">
            <h4>2026 西浦创业家学院邀请赛</h4>
            <p>冠军</p>
          </div>
          <div class="trophy-icon">🏆</div>
        </div>
      </div>
    </section>

    <section id="team">
      <h2 class="section-title">球队合照</h2>
      <!-- ✅ 修正：合照路径 -->
      <div class="team-photo-wrap">
        <img src="team-photo.jpg" alt="球队合照" onerror="console.log('球队合照加载失败')">
      </div>
    </section>

    <section id="players">
      <h2 class="section-title">球员名单</h2>
      <div id="playerWrap"></div>
    </section>

    <footer>
      © 2026 舍弗勒足球俱乐部 | 官网
    </footer>
  </div>

<script>
const playerWrap = document.getElementById('playerWrap');
const matchWrap = document.getElementById('matchWrap');
const matchTitle = document.getElementById('matchTitle');
const matchTip = document.getElementById('matchTip');
const matchCount = document.getElementById('matchCount');

// 分组顺序：前锋、中场、后卫、门将
const posOrder = ['前锋','中场','后卫','门将'];

// 加载data.json
async function loadData(){
  try{
    const res = await fetch('data.json');
    const data = await res.json();
    renderMatch(data.nextMatch);
    renderPlayers(data.players);
  }catch(e){
    console.error('数据加载失败',e);
    playerWrap.innerHTML = '<p style="color:#aaa;">球员数据加载失败</p>';
  }
}

function renderMatch(match){
  if(!match) return;
  matchTitle.innerText = match.matchTime;
  matchTip.innerText = match.matchTip;
}

function renderPlayers(list){
  // 按位置分组
  const groupMap = {};
  list.forEach(p=>{
    if(!groupMap[p.position]) groupMap[p.position] = [];
    groupMap[p.position].push(p);
  });
  let html = '';
  posOrder.forEach(pos=>{
    if(!groupMap[pos]) return;
    html += `<h3 class="pos-group-title">${pos}</h3>`;
    html += `<div class="players-grid">`;
    groupMap[pos].forEach(player=>{
      // ✅ 球员photo路径直接使用json内的值，不再拼接多余斜杠
      const photoUrl = player.photo || '';
      let tagHtml = '';
      if(player.tag === '队长') tagHtml = `<span class="player-tag tag-captain">队长</span>`;
      if(player.tag === '领队') tagHtml = `<span class="player-tag tag-manager">领队</span>`;
      html += `
      <div class="player-card">
        <div class="player-photo" style="background-image:url('${photoUrl}');"
             onerror="console.log('球员图加载失败：${photoUrl}')">
        </div>
        <div class="player-info">
          <div class="player-num">${player.number}</div>
          <div class="player-name">${player.name} ${tagHtml}</div>
          <div class="player-stat">
            出场：${player.appear}｜进球：${player.goal}<br>
            时长：${player.minutes}｜出生：${player.birth}
          </div>
          <div class="hot-box">热度：<span id="hot-${player.hotKey}">--</span>
            <span class="hot-btn" onclick="addHot('${player.hotKey}')">+1</span>
          </div>
        </div>
      </div>
      `;
    })
    html += `</div>`;
  })
  playerWrap.innerHTML = html;
}

// 热度函数（你后续对接云端数据库再替换）
function addHot(key){
  alert('热度功能待接入云端');
}

loadData();
// 每分钟刷新一次数据
setInterval(loadData, 60 * 1000);
</script>
</body>
</html>
